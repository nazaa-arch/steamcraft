services:
  - type: web
    name: steamcraft-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PORT
        value: 10000
      - key: APP_MODE
        value: demo
      - key: SESSION_SECRET
        generateValue: true
