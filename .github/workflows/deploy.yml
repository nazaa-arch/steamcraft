name: Deploy STEAM-Craft to AnymHost (cPanel)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Ambil Kode Sumber (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Pasang Dependensi
        run: npm ci

      - name: 🔨 Bangun Aplikasi Produksi (Build dist)
        run: npm run build

      - name: 🚀 Sinkronisasi Otomatis ke cPanel AnymHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
          local-dir: ./dist/
          dangerous-clean-slate: false
