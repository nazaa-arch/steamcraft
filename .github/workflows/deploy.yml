name: Deploy Subdomains & Beta Staging to AnymHost (cPanel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy Subdomains and Beta
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Ambil Kode Sumber (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Pasang Dependensi
        run: npm ci

      - name: 🔨 Bangun Aplikasi Beta (Build dist)
        run: npm run build

      - name: 🚀 Multi-Deploy 5 Subdomains & Beta Staging via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/ftp_deploy_all.py
